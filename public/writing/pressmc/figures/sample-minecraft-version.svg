<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="Newest Minecraft version each sampled jar is marked for" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<title>Newest Minecraft version each sampled jar is marked for</title>
<style>
